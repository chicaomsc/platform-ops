name: Deploy Production (Vantry)

# Deploy GitOps de Vantry/Production.
#
# O estado desejado de produção é declarado exclusivamente em:
# apps/vantry/production/release.yml
#
# Fluxo normal:
#   release da aplicação
#   → publicação dos artefatos imutáveis
#   → PR automática no platform-ops
#   → revisão humana e merge
#   → alteração de release.yml na main
#   → deploy automático
#
# workflow_dispatch permanece disponível para reexecução
# operacional/controlada.
#
# O workflow nunca recebe uma versão arbitrária por input.
# A versão, source commit, imagens e digests são obtidos do
# estado desejado versionado no repositório.
#
# O deploy utiliza scripts/deploy.sh, que suporta release.yml
# com verificação de digest e mantém compatibilidade operacional
# com o contrato legado quando necessário.
#
# Os timeouts de conexão SSH, execução remota e healthcheck são
# independentes para evitar que o tempo de conexão limite o
# orçamento total de inicialização/healthcheck da aplicação.

on:
  push:
    branches:
      - main
    paths:
      - "apps/vantry/production/release.yml"

  workflow_dispatch:
    inputs:
      disable_auto_rollback:
        description: "Desabilitar rollback automático em caso de falha de healthcheck"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Nunca executa dois deploys/rollbacks de vantry/production
  # simultaneamente.
  #
  # Uma nova execução aguarda a anterior terminar em vez de
  # interromper um deploy em andamento.
  group: deploy-vantry-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy vantry/production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Mantém secrets e regras específicas de Production
    # centralizados no GitHub Environment.
    #
    # Se o Environment "production" possuir Required Reviewers,
    # o job aguardará aprovação adicional. Para o modelo de dois
    # gates humanos, a PR de promoção no platform-ops deve ser
    # considerada a autorização de produção.
    environment: production

    steps:
      - name: Checkout platform-ops
        uses: actions/checkout@v4

      - name: Instalar yq (versão fixa)
        # Versão fixa deliberadamente.
        #
        # A mesma política de evitar referências móveis utilizada
        # nos artefatos da aplicação é aplicada às ferramentas
        # relevantes do pipeline.
        run: |
          set -euo pipefail

          YQ_VERSION="v4.44.3"

          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          chmod +x /usr/local/bin/yq

          yq --version

      - name: Configurar acesso SSH
        # A chave privada é carregada em um ssh-agent efêmero.
        #
        # Não usa set -x e não imprime a chave.
        # O agente é encerrado ao final do job.
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          eval "$(ssh-agent -s)" >/dev/null

          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" | ssh-add - >/dev/null

          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy — vantry/production
        env:
          SSH_CONNECT_TIMEOUT_SECONDS: "10"
          DEPLOY_COMMAND_TIMEOUT_SECONDS: "600"
          HEALTHCHECK_TIMEOUT_SECONDS: "300"

          # Deploy automático sempre mantém rollback habilitado.
          #
          # --no-auto-rollback somente pode ser solicitado em uma
          # execução manual explícita via workflow_dispatch.
          DISABLE_AUTO_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.disable_auto_rollback || false }}

        run: |
          set -euo pipefail

          ARGS="--app vantry --env production"

          if [[ "${DISABLE_AUTO_ROLLBACK}" == "true" ]]; then
            ARGS="${ARGS} --no-auto-rollback"
          fi

          # shellcheck disable=SC2086
          ./scripts/deploy.sh ${ARGS}

      - name: Encerrar ssh-agent
        if: always()
        run: |
          set -euo pipefail

          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            kill "${SSH_AGENT_PID}" 2>/dev/null || true
          fi

      - name: Resumo
        if: always()
        run: |
          set -euo pipefail

          if [[ -f apps/vantry/production/release.yml ]]; then
            CONTRACT_FILE="apps/vantry/production/release.yml"
          else
            CONTRACT_FILE="apps/vantry/production/versions.env"
          fi

          echo "### Deploy vantry/production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- Resultado do job: \`${{ job.status }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Trigger: \`${{ github.event_name }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Estado desejado usado: \`${CONTRACT_FILE}\` (commit \`${{ github.sha }}\`)" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Ver o passo **Deploy — vantry/production** para os logs completos, incluindo eventual rollback automático." \
            >> "$GITHUB_STEP_SUMMARY"